# Vista previa para el cliente en GitHub Pages (https://nebularmedia.github.io/jotaele/).
# La web real va a SiteGround tal cual; aquí solo se adaptan las rutas a la subcarpeta
# y se marca como noindex para que Google no la indexe antes de publicar.
name: Vista previa (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Preparar copia para /jotaele/
        run: |
          mkdir _site
          rsync -a --exclude '.git' --exclude '.github' --exclude '_site' --exclude '.htaccess' ./ _site/
          cd _site
          # Rutas absolutas → subcarpeta del repositorio
          find . -type f \( -name '*.html' -o -name '*.css' \) -print0 | xargs -0 sed -i -E \
            -e 's#(href|src|action)="/([^/])#\1="/jotaele/\2#g' \
            -e 's#(href|src)="/"#\1="/jotaele/"#g' \
            -e 's#url\(/([^/])#url(/jotaele/\1#g'
          # Vista previa fuera de Google
          find . -name '*.html' -print0 | xargs -0 sed -i 's#<head>#<head>\n    <meta name="robots" content="noindex, nofollow" />#'
          printf 'User-agent: *\nDisallow: /\n' > robots.txt
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
