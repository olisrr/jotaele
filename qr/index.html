<!doctype html>
<html lang="es">
  <head>
    <meta name="robots" content="noindex, nofollow" />
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>QR de la carta · Jota Ele</title>
    <meta name="robots" content="noindex" />
    <link rel="canonical" href="https://jotaelerestaurante.com/qr/" />
    <link rel="alternate" type="text/plain" title="Resumen para agentes de IA" href="/jotaele/llms.txt" />
    <link rel="icon" type="image/svg+xml" href="/jotaele/img/logo_jotaele.svg" />
    <meta name="theme-color" content="#ffffff" />
    <meta property="og:type" content="restaurant" />
    <meta property="og:site_name" content="Restaurante Jota Ele" />
    <meta property="og:title" content="QR de la carta · Jota Ele" />
    <meta property="og:description" content />
    <meta property="og:url" content="https://jotaelerestaurante.com/qr/" />
    <meta property="og:image" content="https://jotaelerestaurante.com/img/restaurante_jotaele_plato_17.webp" />
    <meta property="og:locale" content="es_ES" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="stylesheet" href="/jotaele/css/estilos.css" />
    <style>
      .qr-page {
        background: #eee;
      }
      .qr-sheet[data-astro-cid-tgmwpicm] {
        place-items: center;
        min-height: 100vh;
        padding: 24px;
        display: grid;
      }
      .qr-card[data-astro-cid-tgmwpicm] {
        width: 105mm;
        height: 148mm;
        font-family: var(--font);
        text-align: center;
        background: #fff url(/jotaele/img/fondo_azulejos-1.webp) bottom/100% 22mm no-repeat;
        flex-direction: column;
        align-items: center;
        padding: 12mm 10mm 28mm;
        display: flex;
      }
      .qr-logo[data-astro-cid-tgmwpicm] {
        object-fit: contain;
        width: 36mm;
        height: 16mm;
      }
      .qr-code[data-astro-cid-tgmwpicm] {
        width: 62mm;
        margin-top: 8mm;
      }
      .qr-t[data-astro-cid-tgmwpicm] {
        font: 300 20px var(--font);
        color: #000;
        margin-top: 5mm;
      }
      .qr-s[data-astro-cid-tgmwpicm] {
        font: 400 12px var(--font);
        color: #6b6764;
        margin-top: 1mm;
      }
      .qr-u[data-astro-cid-tgmwpicm] {
        font: 500 10px var(--font);
        letter-spacing: 0.08em;
        color: #231f20;
        margin-top: auto;
      }
      @media print {
        @page {
          size: A6;
          margin: 0;
        }
        .qr-page {
          background: #fff;
        }
        .qr-sheet[data-astro-cid-tgmwpicm] {
          min-height: 0;
          padding: 0;
        }
      }
    </style>
  </head>
  <body class="qr-page">
    <main class="qr-sheet" data-astro-cid-tgmwpicm>
      <article class="qr-card" data-astro-cid-tgmwpicm>
        <img class="qr-logo" src="/jotaele/img/logo_jotaele.svg" alt="Jota Ele" data-astro-cid-tgmwpicm />
        <img
          class="qr-code"
          src="/jotaele/qr-carta.svg"
          alt="QR a la carta: jotaelerestaurante.com/carta"
          data-astro-cid-tgmwpicm
        />
        <p class="qr-t" data-astro-cid-tgmwpicm>Carta y vinos</p>
        <p class="qr-s" data-astro-cid-tgmwpicm>Menu &amp; wines</p>
        <p class="qr-u" data-astro-cid-tgmwpicm>jotaelerestaurante.com/carta</p>
      </article>
    </main>
  </body>
</html>
